        content:
          type: string
        coverImage:
          type: string
        images:
          type: array
          items:
            type: string
        location:
          type: string
        author:
          type: string
        publishedAt:
          type: string
      required: [title, excerpt, content, coverImage, location, author]

    JournalEntryUpdate:
      type: object
      properties:
        title:
          type: string
        excerpt:
          type: string
        content:
          type: string
        coverImage:
          type: string
        images:
          type: array
          items:
            type: string
        location:
          type: string
        author:
          type: string
        publishedAt:
          type: string

    # ── Enquiry ─────────────────────────────────────────────────────────
    Notification:
      type: object
      properties:
        id:
          type: number
        enquiryId:
          type: ["number", "null"]
        channel:
          type: string
        templateKey:
          type: string
        recipient:
          type: string
        subject:
          type: ["string", "null"]
        status:
          type: string
          enum: [queued, sent, failed]
        attempts:
          type: number
        lastError:
          type: ["string", "null"]
        createdAt:
          type: string
        sentAt:
          type: ["string", "null"]
      required:
        [
          id,
          enquiryId,
          channel,
          templateKey,
          recipient,
          subject,
          status,
          attempts,
          lastError,
          createdAt,
          sentAt,
        ]

    TestEmailInput:
      type: object
      properties:
        to:
          type: string
          minLength: 3
      required: [to]

    TestEmailResult:
      type: object
      properties:
        messageId:
          type: string
      required: [messageId]

    Enquiry:
      type: object
      properties:
        id:
          type: number
        source:
          type: string
          enum: [tour, contact]
        status:
          type: string
          enum: [new, handled]
        title:
          type: ["string", "null"]
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        isTravelAdvisor:
          type: ["boolean", "null"]
        notes:
          type: ["string", "null"]
        acceptPrivacy:
          type: boolean
        receiveUpdates:
          type: boolean
        tourTitle:
          type: ["string", "null"]
        tourLocation:
          type: ["string", "null"]
        tourDurationDays:
          type: ["number", "null"]
        enquiryType:
          type: ["string", "null"]
        budget:
          type: ["string", "null"]
        createdAt:
          type: string
        handledAt:
          type: ["string", "null"]
      required: [id, source, status, firstName, lastName, email, acceptPrivacy, receiveUpdates, createdAt]

    EnquiryInput:
      type: object
      properties:
        source:
          type: string
          enum: [tour, contact]
        title:
          type: string
          maxLength: 50
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
          maxLength: 254
        phone:
          type: ["string", "null"]
          maxLength: 50
        isTravelAdvisor:
          type: ["boolean", "null"]
        notes:
          type: ["string", "null"]
          maxLength: 5000
        acceptPrivacy:
          type: boolean
        receiveUpdates:
          type: boolean
        tourTitle:
          type: string
          maxLength: 200
        tourLocation:
          type: string
          maxLength: 200
        tourDurationDays:
          type: number
          minimum: 1
          multipleOf: 1
        enquiryType:
          type: string
          enum: [tour-booking, custom-journey, membership, corporate, general]
        budget:
          type: ["string", "null"]
          maxLength: 100
      required: [source, firstName, lastName, email, acceptPrivacy, receiveUpdates]

    EnquiryStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [new, handled]
      required: [status]

    # ── Storage ───────────────────────────────────────────────────────
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: number
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Tour taxonomy ─────────────────────────────────────────────────

    TourCategoryTaxonomy:
      type: object
      properties:
        slug:
          type: ["string", "null"]
        name:
          type: string
        icon:
          type: ["string", "null"]
      required: [name]

    TourDestinationTaxonomy:
      type: object
      properties:
        slug:
          type: ["string", "null"]
        name:
          type: string
      required: [name]

    TourLocationTaxonomy:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
      required: [slug, name]

    TourCountryTaxonomy:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        code:
          type: ["string", "null"]
      required: [slug, name, code]

    TourActivityItem:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        icon:
          type: ["string", "null"]
      required: [slug, name, icon]

    TourActivitySection:
      type: object
      properties:
        groupSlug:
          type: string
        groupName:
          type: string
        activities:
          type: array
          items:
            $ref: "#/components/schemas/TourActivityItem"
      required: [groupSlug, groupName, activities]

    TourWithTaxonomy:
      # Standalone — not allOf[Tour] — because Drizzle's relational query API
      # shadows the legacy `tours.location: text` column with the joined Location
      # relation object, making them the same key at runtime. Using allOf would
      # produce an impossible Zod intersection (string AND object). Instead we
      # list all Tour fields explicitly, replacing `location` with the taxonomy
      # object, and promote `country` to the top level.
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: string
        coverImage:
          type: string
        images:
          type: array
          items:
            type: string
        durationDays:
          type: number
        priceFrom:
          type: number
        featured:
          type: boolean
        classification:
          type: string
          enum: [standard, special, exclusive]
        slug:
          type: ["string", "null"]
        locationName:
          type: ["string", "null"]
        countryName:
          type: ["string", "null"]
        categoryId:
          type: ["number", "null"]
        destinationId:
          type: ["number", "null"]
        itinerarySteps:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryStep"
        createdAt:
          type: string
        updatedAt:
          type: string
        category:
          oneOf:
            - $ref: "#/components/schemas/TourCategoryTaxonomy"
            - type: "null"
        destination:
          oneOf:
            - $ref: "#/components/schemas/TourDestinationTaxonomy"
            - type: "null"
        location:
          oneOf:
            - $ref: "#/components/schemas/TourLocationTaxonomy"
            - type: "null"
        country:
          oneOf:
            - $ref: "#/components/schemas/TourCountryTaxonomy"
            - type: "null"
        activitySections:
          type: array
          items:
            $ref: "#/components/schemas/TourActivitySection"
      required:
        - id
        - title
        - description
        - coverImage
        - images
        - durationDays
        - priceFrom
        - featured
        - itinerarySteps
        - createdAt
        - updatedAt
        - category
        - destination
        - location
        - country
        - activitySections

    # ── Stats ─────────────────────────────────────────────────────────
    Stats:
      type: object
      properties:
        tourCount:
          type: number
        destinationCount:
          type: number
        categoryCount:
          type: number
        journalCount:
          type: number
        featuredTourCount:
          type: number
      required: [tourCount, destinationCount, categoryCount, journalCount, featuredTourCount]
