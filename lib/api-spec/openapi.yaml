openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MNT Embark API — luxury tour company
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tours
    description: Tour operations
  - name: activities
    description: Activity filter operations
  - name: destinations
    description: Destination operations
  - name: categories
    description: Category operations
  - name: journals
    description: Travel journal operations
  - name: enquiries
    description: Customer enquiry operations
  - name: search
    description: AI-powered search
  - name: stats
    description: Dashboard statistics
  - name: locations
    description: Location operations
  - name: countries
    description: Country operations
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Activities ────────────────────────────────────────────────────────
  /activities:
    get:
      operationId: listActivityFilters
      tags: [activities]
      summary: Activity groups with live tour counts for the filter sidebar
      responses:
        "200":
          description: Activity filter groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityFilterGroup"

  /activities/{slug}:
    get:
      operationId: getActivityBySlug
      tags: [activities]
      summary: Get a single activity by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Activity detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDetail"
        "404":
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Tours ─────────────────────────────────────────────────────────────
  /tours:
    get:
      operationId: listTours
      tags: [tours]
      summary: List all tours
      parameters:
        - name: categoryId
          in: query
          schema: { type: number }
        - name: destinationId
          in: query
          schema: { type: number }
        - name: categorySlug
          in: query
          schema: { type: string }
        - name: destinationSlug
          in: query
          schema: { type: string }
        - name: countrySlug
          in: query
          schema: { type: string }
        - name: locationSlug
          in: query
          schema: { type: string }
        - name: classification
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [standard, special, exclusive]
          style: form
          explode: true
        - name: activitySlugs
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: List of tours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"
    post:
      operationId: createTour
      tags: [tours]
      summary: Create a tour
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourInput"
      responses:
        "201":
          description: Created tour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"

  /tours/featured:
    get:
      operationId: getFeaturedTours
      tags: [tours]
      summary: Get featured spotlight tours
      responses:
        "200":
          description: Featured tours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"

  /tours/search:
    get:
      operationId: searchTours
      tags: [search]
      summary: AI-powered tour search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: categoryId
          in: query
          schema: { type: number }
        - name: destinationId
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Matching tours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"

  /tours/slug/{slug}:
    get:
      operationId: getTourBySlug
      tags: [tours]
      summary: Get a tour by slug with full taxonomy
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tour with full taxonomy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourWithTaxonomy"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /tours/{id}:
    get:
      operationId: getTour
      tags: [tours]
      summary: Get a tour by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Tour detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateTour
      tags: [tours]
      summary: Update a tour
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourUpdate"
      responses:
        "200":
          description: Updated tour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteTour
      tags: [tours]
      summary: Delete a tour
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /tours/{id}/activities:
    put:
      operationId: setTourActivities
      tags: [tours]
      summary: Replace a tour's full activity set (max 10)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourActivitiesInput"
      responses:
        "204":
          description: Activities updated
        "400":
          description: Validation error (e.g. exceeds activity cap)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Tour not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Destinations ──────────────────────────────────────────────────────
  /destinations:
    get:
      operationId: listDestinations
      tags: [destinations]
      summary: List all destinations
      responses:
        "200":
          description: List of destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DestinationListItem"
    post:
      operationId: createDestination
      tags: [destinations]
      summary: Create a destination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationInput"
      responses:
        "201":
          description: Created destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"

  /destinations/{id}:
    get:
      operationId: getDestination
      tags: [destinations]
      summary: Get a destination by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateDestination
      tags: [destinations]
      summary: Update a destination
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationUpdate"
      responses:
        "200":
          description: Updated destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteDestination
      tags: [destinations]
      summary: Delete a destination
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /destinations/{slug}/places:
    get:
      operationId: getDestinationPlaces
      tags: [destinations]
      summary: Countries and locations linked to a destination
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Place hierarchy for this destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationPlaces"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # Admin endpoint: read/write the country+location ID sets for a destination.
  # Uses integer {id} while the public endpoint above uses string {slug}.
  /destinations/{id}/places:
    get:
      operationId: getDestinationPlacesById
      tags: [destinations]
      summary: Country and location IDs linked to a destination (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: ID arrays for the destination's linked places
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationPlacesIds"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: setDestinationPlaces
      tags: [destinations]
      summary: Replace the country and location sets for a destination (admin)
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationPlacesInput"
      responses:
        "204":
          description: Updated
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Locations ─────────────────────────────────────────────────────────
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: All locations with country name for admin selects
      responses:
        "200":
          description: Location list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocationSummary"

  # ── Countries ─────────────────────────────────────────────────────────
  /countries:
    get:
      operationId: listCountries
      tags: [countries]
      summary: All countries ordered by display_order for admin selects
      responses:
        "200":
          description: Country list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountrySummary"

  # ── Categories ────────────────────────────────────────────────────────
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get a category by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Journal Entries ───────────────────────────────────────────────────
  /journals:
    get:
      operationId: listJournalEntries
      tags: [journals]
      summary: List all journal entries
      responses:
        "200":
          description: List of journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createJournalEntry
      tags: [journals]
      summary: Create a journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: Created journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journals/{id}:
    get:
      operationId: getJournalEntry
      tags: [journals]
      summary: Get a journal entry by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateJournalEntry
      tags: [journals]
      summary: Update a journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryUpdate"
      responses:
        "200":
          description: Updated journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteJournalEntry
      tags: [journals]
      summary: Delete a journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Enquiries ─────────────────────────────────────────────────────────
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Submit a customer enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "400":
          description: Invalid enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/enquiries:
    get:
      operationId: listEnquiries
      tags: [enquiries]
      summary: List customer enquiries for admins
      security:
        - adminSession: []
      responses:
        "200":
          description: Enquiries ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enquiry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/enquiries/{id}/status:
    patch:
      operationId: updateEnquiryStatus
      tags: [enquiries]
      summary: Update an enquiry lifecycle status
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryStatusInput"
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Stats ─────────────────────────────────────────────────────────────
  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    # ── Itinerary Step ─────────────────────────────────────────────────
    ItineraryStep:
      type: object
      properties:
        type:
          type: string
          enum: [Pickup, Flight, Visa, Layover, Ride, Hotel, Activities]
        title:
          type: string
        description:
          type: string
        image:
          type: ["string", "null"]
      required: [type, title, description]

    # ── Tour ──────────────────────────────────────────────────────────
    Tour:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: string
        coverImage:
          type: string
        images:
          type: array
          items:
            type: string
        location:
          type: string
        durationDays:
          type: number
        priceFrom:
          type: number
        featured:
          type: boolean
        classification:
          type: string
          enum: [standard, special, exclusive]
        slug:
          type: ["string", "null"]
        locationId:
          type: ["number", "null"]
        locationName:
          type: ["string", "null"]
        countryName:
          type: ["string", "null"]
        categoryId:
          type: ["number", "null"]
        destinationId:
          type: ["number", "null"]
        itinerarySteps:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryStep"
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, title, description, coverImage, images, location, durationDays, priceFrom, featured, itinerarySteps, createdAt, updatedAt]

    TourInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        coverImage:
          type: string
        images:
          type: array
          items:
            type: string
        location:
          type: string
        durationDays:
          type: number
        priceFrom:
          type: number
        featured:
          type: boolean
        categoryId:
          type: ["number", "null"]
        destinationId:
          type: ["number", "null"]
        itinerarySteps:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryStep"
      required: [title, description, coverImage, location, durationDays, priceFrom]

    TourUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        coverImage:
          type: string
        images:
          type: array
          items:
            type: string
        location:
          type: string
        durationDays:
          type: number
        priceFrom:
          type: number
        featured:
          type: boolean
        classification:
          type: string
          enum: [standard, special, exclusive]
        categoryId:
          type: ["number", "null"]
        destinationId:
          type: ["number", "null"]
        locationId:
          type: ["number", "null"]
        itinerarySteps:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryStep"

    # ── Activity filters ──────────────────────────────────────────────
    ActivityFilterItem:
      type: object
      properties:
        id:
          type: number
        slug:
          type: string
        name:
          type: string
        icon:
          type: ["string", "null"]
        aliases:
          type: array
          items:
            type: string
        count:
          type: number
      required: [id, slug, name, icon, aliases, count]

    ActivityFilterGroup:
      type: object
      properties:
        groupSlug:
          type: string
        groupName:
          type: string
        activities:
          type: array
          items:
            $ref: "#/components/schemas/ActivityFilterItem"
      required: [groupSlug, groupName, activities]

    TourActivitiesInput:
      type: object
      properties:
        activityIds:
          type: array
          items:
            type: number
      required: [activityIds]

    ActivityDetail:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        coverImage:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        groupSlug:
          type: string
        groupName:
          type: string
