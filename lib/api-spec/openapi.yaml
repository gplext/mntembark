openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MNT Embark API — luxury tour company
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tours
    description: Tour operations
  - name: activities
    description: Activity filter operations
  - name: destinations
    description: Destination operations
  - name: categories
    description: Category operations
  - name: journals
    description: Travel journal operations
  - name: enquiries
    description: Customer enquiry operations
  - name: search
    description: AI-powered search
  - name: stats
    description: Dashboard statistics
  - name: locations
    description: Location operations
  - name: countries
    description: Country operations
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Activities ────────────────────────────────────────────────────────
  /activities:
    get:
      operationId: listActivityFilters
      tags: [activities]
      summary: Activity groups with live tour counts for the filter sidebar
      responses:
        "200":
          description: Activity filter groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityFilterGroup"

  /activities/{slug}:
    get:
      operationId: getActivityBySlug
      tags: [activities]
      summary: Get a single activity by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Activity detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDetail"
        "404":
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Activity administration ───────────────────────────────────────────
  # Separate from GET /activities, which returns filter groups shaped for the
  # public sidebar: only filterable activities, with live tour counts and no
  # editing fields. These return the rows as stored.
  /admin/activity-groups:
    get:
      operationId: listActivityGroups
      tags: [activities]
      summary: List every activity group, including empty ones
      responses:
        "200":
          description: Activity groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminActivityGroup"
    post:
      operationId: createActivityGroup
      tags: [activities]
      summary: Create an activity group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityGroupInput"
      responses:
        "201":
          description: Created group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActivityGroup"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/activity-groups/{id}:
    patch:
      operationId: updateActivityGroup
      tags: [activities]
      summary: Update an activity group
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityGroupUpdate"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActivityGroup"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteActivityGroup
      tags: [activities]
      summary: Delete an activity group
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Group still has activities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/activities:
    get:
      operationId: listAllActivities
      tags: [activities]
      summary: List every activity as stored, filterable or not
      responses:
        "200":
          description: Activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminActivity"
    post:
      operationId: createActivity
      tags: [activities]
      summary: Create an activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Created activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActivity"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/activities/{id}:
    patch:
      operationId: updateActivity
      tags: [activities]
      summary: Update an activity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityUpdate"
      responses:
        "200":
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActivity"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteActivity
      tags: [activities]
      summary: Delete an activity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Activity is still attached to tours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Tours ─────────────────────────────────────────────────────────────
  /tours:
    get:
      operationId: listTours
      tags: [tours]
      summary: List all tours
      parameters:
        - name: categoryId
          in: query
          schema: { type: number }
        - name: destinationId
          in: query
          schema: { type: number }
        - name: categorySlug
          in: query
          schema: { type: string }
        - name: destinationSlug
          in: query
          schema: { type: string }
        - name: countrySlug
          in: query
          schema: { type: string }
        - name: locationSlug
          in: query
          schema: { type: string }
        - name: classification
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [standard, special, exclusive]
          style: form
          explode: true
        - name: activitySlugs
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: List of tours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"
    post:
      operationId: createTour
      tags: [tours]
      summary: Create a tour
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourInput"
      responses:
        "201":
          description: Created tour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"

  /tours/featured:
    get:
      operationId: getFeaturedTours
      tags: [tours]
      summary: Get featured spotlight tours
      responses:
        "200":
          description: Featured tours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"

  /tours/search:
    get:
      operationId: searchTours
      tags: [search]
      summary: AI-powered tour search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: categoryId
          in: query
          schema: { type: number }
        - name: destinationId
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Matching tours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"

  /tours/slug/{slug}:
    get:
      operationId: getTourBySlug
      tags: [tours]
      summary: Get a tour by slug with full taxonomy
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tour with full taxonomy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourWithTaxonomy"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /tours/{id}:
    get:
      operationId: getTour
      tags: [tours]
      summary: Get a tour by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Tour detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateTour
      tags: [tours]
      summary: Update a tour
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourUpdate"
      responses:
        "200":
          description: Updated tour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteTour
      tags: [tours]
      summary: Delete a tour
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /tours/{id}/activities:
    put:
      operationId: setTourActivities
      tags: [tours]
      summary: Replace a tour's full activity set (max 10)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourActivitiesInput"
      responses:
        "204":
          description: Activities updated
        "400":
          description: Validation error (e.g. exceeds activity cap)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Tour not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Tour guide copy ───────────────────────────────────────────────────
  /tours/{id}/guide:
    get:
      operationId: getTourGuide
      tags: [tours]
      summary: Authored guide copy for a tour
      description: >
        404 when no copy has been written for this tour. That is an ordinary
        state, not an error condition — the public page falls back to its
        generated text.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Guide copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourGuide"
        "404":
          description: No guide copy written for this tour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: setTourGuide
      tags: [tours]
      summary: Create or replace a tour's guide copy
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourGuideInput"
      responses:
        "200":
          description: Saved guide copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourGuide"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Tour not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteTourGuide
      tags: [tours]
      summary: Discard a tour's guide copy and revert to generated text
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: No guide copy written for this tour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /guides:
    get:
      operationId: listTourGuides
      tags: [tours]
      summary: Published guide entries, for the public guide page
      responses:
        "200":
          description: Guide entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TourGuide"

  /admin/guides:
    get:
      operationId: listAllTourGuides
      tags: [tours]
      summary: Every guide entry including unpublished drafts
      description: >
        The admin editor needs this rather than /guides: an unpublished draft is
        absent from the public list, so a screen built on that list would show a
        drafted tour as unwritten and open its editor empty.
      responses:
        "200":
          description: Guide entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TourGuide"

  # ── Destinations ──────────────────────────────────────────────────────
  /destinations:
    get:
      operationId: listDestinations
      tags: [destinations]
      summary: List all destinations
      responses:
        "200":
          description: List of destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DestinationListItem"
    post:
      operationId: createDestination
      tags: [destinations]
      summary: Create a destination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationInput"
      responses:
        "201":
          description: Created destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"

  /destinations/{id}:
    get:
      operationId: getDestination
      tags: [destinations]
      summary: Get a destination by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateDestination
      tags: [destinations]
      summary: Update a destination
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationUpdate"
      responses:
        "200":
          description: Updated destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteDestination
      tags: [destinations]
      summary: Delete a destination
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /destinations/{slug}/places:
    get:
      operationId: getDestinationPlaces
      tags: [destinations]
      summary: Countries and locations linked to a destination
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Place hierarchy for this destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationPlaces"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # Admin endpoint: read/write the country+location ID sets for a destination.
  # Uses integer {id} while the public endpoint above uses string {slug}.
  /destinations/{id}/places:
    get:
      operationId: getDestinationPlacesById
      tags: [destinations]
      summary: Country and location IDs linked to a destination (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: ID arrays for the destination's linked places
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationPlacesIds"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: setDestinationPlaces
      tags: [destinations]
      summary: Replace the country and location sets for a destination (admin)
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationPlacesInput"
      responses:
        "204":
          description: Updated
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Locations ─────────────────────────────────────────────────────────
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: All locations with country name for admin selects
      responses:
        "200":
          description: Location list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocationSummary"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Create a new location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "201":
          description: Created location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationSummary"

  /locations/{id}:
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Update a location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdateInput"
      responses:
        "200":
          description: Updated location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationSummary"
    delete:
      operationId: deleteLocation
      tags: [locations]
      summary: Delete a location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  # ── Countries ─────────────────────────────────────────────────────────
  /countries:
    get:
      operationId: listCountries
      tags: [countries]
      summary: All countries ordered by display_order for admin selects
      responses:
        "200":
          description: Country list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountrySummary"
    post:
      operationId: createCountry
      tags: [countries]
      summary: Create a new country
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountryInput"
      responses:
        "201":
          description: Created country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountrySummary"

  /countries/{id}:
    patch:
      operationId: updateCountry
      tags: [countries]
      summary: Update a country
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountryUpdateInput"
      responses:
        "200":
          description: Updated country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountrySummary"
    delete:
      operationId: deleteCountry
      tags: [countries]
      summary: Delete a country
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  # ── Categories ────────────────────────────────────────────────────────
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get a category by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Journal Entries ───────────────────────────────────────────────────
  /journals:
    get:
      operationId: listJournalEntries
      tags: [journals]
      summary: List all journal entries
      responses:
        "200":
          description: List of journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createJournalEntry
      tags: [journals]
      summary: Create a journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: Created journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journals/{id}:
    get:
      operationId: getJournalEntry
      tags: [journals]
      summary: Get a journal entry by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateJournalEntry
      tags: [journals]
      summary: Update a journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryUpdate"
      responses:
        "200":
          description: Updated journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteJournalEntry
      tags: [journals]
      summary: Delete a journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Enquiries ─────────────────────────────────────────────────────────
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Submit a customer enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "400":
          description: Invalid enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/enquiries/{id}/notifications:
    get:
      operationId: listEnquiryNotifications
      tags: [enquiries]
      summary: Messages queued or sent for an enquiry
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /admin/notifications/{id}/resend:
    post:
      operationId: resendNotification
      tags: [enquiries]
      summary: Put a message back in the send queue
      description: >
        Resets the attempt counter - a resend follows a human fixing something,
        so it gets a fresh set of attempts rather than inheriting an exhausted
        one.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "202":
          description: Queued for sending
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/notifications/test:
    post:
      operationId: sendTestEmail
      tags: [enquiries]
      summary: Send a test email to prove SMTP works
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestEmailInput"
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestEmailResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Email is not configured on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/enquiries:
    get:
      operationId: listEnquiries
      tags: [enquiries]
      summary: List customer enquiries for admins
      security:
        - adminSession: []
      responses:
        "200":
          description: Enquiries ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enquiry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/enquiries/{id}:
    delete:
      operationId: deleteEnquiry
      tags: [enquiries]
      summary: Delete an enquiry and its notification history
      description: >
        Permanent. The notification rows go with it — they describe messages
        sent about this enquiry and mean nothing without it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/enquiries/{id}/status:
    patch:
      operationId: updateEnquiryStatus
      tags: [enquiries]
      summary: Update an enquiry lifecycle status
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryStatusInput"
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Stats ─────────────────────────────────────────────────────────────
  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

