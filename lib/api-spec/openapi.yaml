          type: string
        name:
          type: string
        code:
          type: ["string", "null"]
      required: [slug, name, code]

    TourActivityItem:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        icon:
          type: ["string", "null"]
      required: [slug, name, icon]

    TourActivitySection:
      type: object
      properties:
        groupSlug:
          type: string
        groupName:
          type: string
        activities:
          type: array
          items:
            $ref: "#/components/schemas/TourActivityItem"
      required: [groupSlug, groupName, activities]

    TourWithTaxonomy:
      # Standalone — not allOf[Tour] — because Drizzle's relational query API
      # shadows the legacy `tours.location: text` column with the joined Location
      # relation object, making them the same key at runtime. Using allOf would
      # produce an impossible Zod intersection (string AND object). Instead we
      # list all Tour fields explicitly, replacing `location` with the taxonomy
      # object, and promote `country` to the top level.
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: string
        coverImage:
          type: string
        images:
          type: array
          items:
            type: string
        durationDays:
          type: number
        priceFrom:
          type: number
        featured:
          type: boolean
        classification:
          type: string
          enum: [standard, special, exclusive]
        slug:
          type: ["string", "null"]
        locationName:
          type: ["string", "null"]
        countryName:
          type: ["string", "null"]
        categoryId:
          type: ["number", "null"]
        destinationId:
          type: ["number", "null"]
        itinerarySteps:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryStep"
        createdAt:
          type: string
        updatedAt:
          type: string
        category:
          oneOf:
            - $ref: "#/components/schemas/TourCategoryTaxonomy"
            - type: "null"
        destination:
          oneOf:
            - $ref: "#/components/schemas/TourDestinationTaxonomy"
            - type: "null"
        location:
          oneOf:
            - $ref: "#/components/schemas/TourLocationTaxonomy"
            - type: "null"
        country:
          oneOf:
            - $ref: "#/components/schemas/TourCountryTaxonomy"
            - type: "null"
        activitySections:
          type: array
          items:
            $ref: "#/components/schemas/TourActivitySection"
      required:
        - id
        - title
        - description
        - coverImage
        - images
        - durationDays
        - priceFrom
        - featured
        - itinerarySteps
        - createdAt
        - updatedAt
        - category
        - destination
        - location
        - country
        - activitySections

    # ── Stats ─────────────────────────────────────────────────────────
    Stats:
      type: object
      properties:
        tourCount:
          type: number
        destinationCount:
          type: number
        categoryCount:
          type: number
        journalCount:
          type: number
        featuredTourCount:
          type: number
      required: [tourCount, destinationCount, categoryCount, journalCount, featuredTourCount]
