openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MNT Embark API — luxury tour company
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tours
    description: Tour operations
  - name: destinations
    description: Destination operations
  - name: categories
    description: Category operations
  - name: journals
    description: Travel journal operations
  - name: search
    description: AI-powered search
  - name: stats
    description: Dashboard statistics
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Tours ─────────────────────────────────────────────────────────────
  /tours:
    get:
      operationId: listTours
      tags: [tours]
      summary: List all tours
      parameters:
        - name: categoryId
          in: query
          schema: { type: number }
        - name: destinationId
          in: query
          schema: { type: number }
      responses:
        "200":
          description: List of tours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"
    post:
      operationId: createTour
      tags: [tours]
      summary: Create a tour
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourInput"
      responses:
        "201":
          description: Created tour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"

  /tours/featured:
    get:
      operationId: getFeaturedTours
      tags: [tours]
      summary: Get featured spotlight tours
      responses:
        "200":
          description: Featured tours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"

  /tours/search:
    get:
      operationId: searchTours
      tags: [search]
      summary: AI-powered tour search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: categoryId
          in: query
          schema: { type: number }
        - name: destinationId
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Matching tours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"

  /tours/{id}:
    get:
      operationId: getTour
      tags: [tours]
      summary: Get a tour by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Tour detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateTour
      tags: [tours]
      summary: Update a tour
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourUpdate"
      responses:
        "200":
          description: Updated tour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteTour
      tags: [tours]
      summary: Delete a tour
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Destinations ──────────────────────────────────────────────────────
  /destinations:
    get:
      operationId: listDestinations
      tags: [destinations]
      summary: List all destinations
      responses:
        "200":
          description: List of destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Destination"
    post:
      operationId: createDestination
      tags: [destinations]
      summary: Create a destination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationInput"
      responses:
        "201":
          description: Created destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"

  /destinations/{id}:
    get:
      operationId: getDestination
      tags: [destinations]
      summary: Get a destination by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateDestination
      tags: [destinations]
      summary: Update a destination
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationUpdate"
      responses:
        "200":
          description: Updated destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteDestination
      tags: [destinations]
      summary: Delete a destination
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Categories ────────────────────────────────────────────────────────
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get a category by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Journal Entries ───────────────────────────────────────────────────
  /journals:
    get:
      operationId: listJournalEntries
      tags: [journals]
      summary: List all journal entries
      responses:
        "200":
          description: List of journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createJournalEntry
      tags: [journals]
      summary: Create a journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: Created journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journals/{id}:
    get:
      operationId: getJournalEntry
      tags: [journals]
      summary: Get a journal entry by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateJournalEntry
      tags: [journals]
      summary: Update a journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryUpdate"
      responses:
        "200":
          description: Updated journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteJournalEntry
      tags: [journals]
      summary: Delete a journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Stats ─────────────────────────────────────────────────────────────
  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    # ── Itinerary Step ─────────────────────────────────────────────────
    ItineraryStep:
      type: object
      properties:
        type:
          type: string
          enum: [Pickup, Flight, Visa, Layover, Ride, Hotel, Activities]
        title:
          type: string
        description:
          type: string
        image:
          type: ["string", "null"]
      required: [type, title, description]

    # ── Tour ──────────────────────────────────────────────────────────
    Tour:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: string
        coverImage:
          type: string
        images:
          type: array
          items:
            type: string
        location:
          type: string
        durationDays:
          type: number
        priceFrom:
          type: number
        featured:
          type: boolean
        categoryId:
          type: ["number", "null"]
        destinationId:
          type: ["number", "null"]
        itinerarySteps:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryStep"
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, title, description, coverImage, images, location, durationDays, priceFrom, featured, itinerarySteps, createdAt, updatedAt]

    TourInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        coverImage:
          type: string
        images:
          type: array
          items:
            type: string
        location:
          type: string
        durationDays:
          type: number
        priceFrom:
          type: number
        featured:
          type: boolean
        categoryId:
          type: ["number", "null"]
        destinationId:
          type: ["number", "null"]
        itinerarySteps:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryStep"
      required: [title, description, coverImage, location, durationDays, priceFrom]

    TourUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        coverImage:
          type: string
        images:
          type: array
          items:
            type: string
        location:
          type: string
        durationDays:
          type: number
        priceFrom:
          type: number
        featured:
          type: boolean
        categoryId:
          type: ["number", "null"]
        destinationId:
          type: ["number", "null"]
        itinerarySteps:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryStep"

    # ── Destination ───────────────────────────────────────────────────
    Destination:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        country:
          type: string
        region:
          type: ["string", "null"]
        description:
          type: string
        coverImage:
          type: string
        createdAt:
          type: string
      required: [id, name, country, description, coverImage, createdAt]

    DestinationInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 1
        region:
          type: string
        description:
          type: string
        coverImage:
          type: string
      required: [name, country, description, coverImage]

    DestinationUpdate:
      type: object
      properties:
        name:
          type: string
        country:
          type: string
        region:
          type: string
        description:
          type: string
        coverImage:
          type: string

    # ── Category ─────────────────────────────────────────────────────
    Category:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: string
        coverImage:
          type: string
        createdAt:
          type: string
      required: [id, name, description, coverImage, createdAt]

    CategoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        coverImage:
          type: string
      required: [name, description, coverImage]

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        coverImage:
          type: string

    # ── Journal Entry ─────────────────────────────────────────────────
    JournalEntry:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        excerpt:
          type: string
        content:
          type: string
        coverImage:
          type: string
        images:
          type: array
          items:
            type: string
        location:
          type: string
        author:
          type: string
        publishedAt:
          type: string
        createdAt:
          type: string
      required: [id, title, excerpt, content, coverImage, images, location, author, publishedAt, createdAt]

    JournalEntryInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        excerpt:
          type: string
        content:
          type: string
        coverImage:
          type: string
        images:
          type: array
          items:
            type: string
        location:
          type: string
        author:
          type: string
        publishedAt:
          type: string
      required: [title, excerpt, content, coverImage, location, author]

    JournalEntryUpdate:
      type: object
      properties:
        title:
          type: string
        excerpt:
          type: string
        content:
          type: string
        coverImage:
          type: string
        images:
          type: array
          items:
            type: string
        location:
          type: string
        author:
          type: string
        publishedAt:
          type: string

    # ── Storage ───────────────────────────────────────────────────────
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: number
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Stats ─────────────────────────────────────────────────────────
    Stats:
      type: object
      properties:
        tourCount:
          type: number
        destinationCount:
          type: number
        categoryCount:
          type: number
        journalCount:
          type: number
        featuredTourCount:
          type: number
      required: [tourCount, destinationCount, categoryCount, journalCount, featuredTourCount]
