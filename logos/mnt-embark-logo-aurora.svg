<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
<defs>

  <!-- Night sky background gradient -->
  <radialGradient id="sky" cx="50%" cy="35%" r="65%">
    <stop offset="0%"   stop-color="#0B1B30"/>
    <stop offset="100%" stop-color="#020509"/>
  </radialGradient>

  <!-- Aurora colour gradients (horizontal) -->
  <linearGradient id="ag1" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#00FF88" stop-opacity="0"/>
    <stop offset="25%"  stop-color="#00FF88" stop-opacity="0.65"/>
    <stop offset="60%"  stop-color="#00DDAA" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#00DDAA" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ag2" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#8833FF" stop-opacity="0"/>
    <stop offset="35%"  stop-color="#9944FF" stop-opacity="0.50"/>
    <stop offset="65%"  stop-color="#0099FF" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#0099FF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ag3" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#00FFCC" stop-opacity="0"/>
    <stop offset="40%"  stop-color="#00FFBB" stop-opacity="0.55"/>
    <stop offset="75%"  stop-color="#44FF99" stop-opacity="0.40"/>
    <stop offset="100%" stop-color="#44FF99" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ag4" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#FF44CC" stop-opacity="0"/>
    <stop offset="45%"  stop-color="#CC44FF" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#CC44FF" stop-opacity="0"/>
  </linearGradient>

  <!-- Text aurora gradient -->
  <linearGradient id="textAurora" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#66FFCC"/>
    <stop offset="35%"  stop-color="#FFFFFF"/>
    <stop offset="65%"  stop-color="#CCDDFF"/>
    <stop offset="100%" stop-color="#88FFDD"/>
  </linearGradient>

  <!-- Aurora glow filter -->
  <filter id="aGlow" x="-15%" y="-80%" width="130%" height="260%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Soft glow for text -->
  <filter id="tGlow" x="-8%" y="-40%" width="116%" height="180%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Star twinkle glow -->
  <filter id="sGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

</defs>

<!-- ── NIGHT SKY ── -->
<rect width="800" height="450" fill="url(#sky)"/>

<!-- ── STARS ── -->
<circle cx="42"  cy="22"  r="0.8" fill="white" opacity="0.5"/>
<circle cx="115" cy="38"  r="0.7" fill="white" opacity="0.4"/>
<circle cx="188" cy="14"  r="1.0" fill="white" opacity="0.6"/>
<circle cx="255" cy="42"  r="0.8" fill="white" opacity="0.5"/>
<circle cx="335" cy="18"  r="0.7" fill="white" opacity="0.45"/>
<circle cx="410" cy="36"  r="0.9" fill="white" opacity="0.55"/>
<circle cx="488" cy="12"  r="0.7" fill="white" opacity="0.4"/>
<circle cx="562" cy="44"  r="0.9" fill="white" opacity="0.5"/>
<circle cx="638" cy="19"  r="0.8" fill="white" opacity="0.6"/>
<circle cx="714" cy="38"  r="0.7" fill="white" opacity="0.4"/>
<circle cx="770" cy="22"  r="0.9" fill="white" opacity="0.55"/>
<circle cx="72"  cy="66"  r="0.7" fill="white" opacity="0.35"/>
<circle cx="320" cy="60"  r="0.8" fill="white" opacity="0.4"/>
<circle cx="680" cy="58"  r="0.7" fill="white" opacity="0.35"/>
<circle cx="740" cy="72"  r="0.6" fill="white" opacity="0.3"/>
<!-- Brighter 4-pointed stars -->
<path d="M158,30 L159.8,35 L164,30 L159.8,25 Z" fill="white" opacity="0.90" filter="url(#sGlow)"/>
<path d="M598,28 L599.8,33 L604,28 L599.8,23 Z" fill="white" opacity="0.85" filter="url(#sGlow)"/>
<path d="M380,16 L381.5,20 L385,16 L381.5,12 Z" fill="white" opacity="0.80" filter="url(#sGlow)"/>
<!-- Glowing brighter stars -->
<circle cx="210" cy="52"  r="1.4" fill="white" opacity="0.85" filter="url(#sGlow)"/>
<circle cx="510" cy="30"  r="1.3" fill="white" opacity="0.80" filter="url(#sGlow)"/>
<circle cx="86"  cy="46"  r="1.2" fill="white" opacity="0.75" filter="url(#sGlow)"/>
<circle cx="718" cy="50"  r="1.3" fill="white" opacity="0.80" filter="url(#sGlow)"/>

<!-- ── AURORA BANDS ── -->
<!-- Main wide green band -->
<path d="M-60,155 C80,120 180,170 340,135 C500,100 640,158 860,125"
  stroke="url(#ag1)" stroke-width="55" fill="none" filter="url(#aGlow)" opacity="0.80"/>
<!-- Thin bright green wisp above -->
<path d="M-60,105 C120,78 240,118 390,90 C540,62 660,108 860,82"
  stroke="url(#ag3)" stroke-width="22" fill="none" filter="url(#aGlow)" opacity="0.65"/>
<!-- Purple-blue lower band -->
<path d="M-60,210 C100,182 260,220 420,194 C580,168 700,208 860,182"
  stroke="url(#ag2)" stroke-width="40" fill="none" filter="url(#aGlow)" opacity="0.60"/>
<!-- Faint pink/magenta accent -->
<path d="M-60,80 C160,58 300,88 480,68 C660,48 740,80 860,60"
  stroke="url(#ag4)" stroke-width="16" fill="none" filter="url(#aGlow)" opacity="0.45"/>
<!-- Upper wisp -->
<path d="M-60,60 C200,42 360,65 560,48 C700,35 760,58 860,44"
  stroke="#00FF99" stroke-width="8" fill="none" filter="url(#aGlow)" opacity="0.25"/>

<!-- ── AURORA VERTICAL CURTAIN RAYS ── -->
<path d="M155,88  C162,128 150,168 157,215" stroke="#00FF88" stroke-width="2.5" fill="none" opacity="0.28" filter="url(#aGlow)"/>
<path d="M238,75  C246,118 232,158 240,208" stroke="#00FFAA" stroke-width="1.8" fill="none" opacity="0.22" filter="url(#aGlow)"/>
<path d="M388,95  C396,135 382,175 390,222" stroke="#44FFCC" stroke-width="2.5" fill="none" opacity="0.26" filter="url(#aGlow)"/>
<path d="M512,82  C521,125 508,162 516,212" stroke="#00FF88" stroke-width="2.0" fill="none" opacity="0.22" filter="url(#aGlow)"/>
<path d="M642,90  C651,130 638,170 646,218" stroke="#88AAFF" stroke-width="2.0" fill="none" opacity="0.20" filter="url(#aGlow)"/>
<path d="M74,118  C82,155  70,188  78,228"  stroke="#00FFBB" stroke-width="1.5" fill="none" opacity="0.18" filter="url(#aGlow)"/>
<path d="M730,100 C739,140 726,178 734,220" stroke="#00FF99" stroke-width="1.8" fill="none" opacity="0.20" filter="url(#aGlow)"/>

<!-- ── MOUNTAIN SILHOUETTE ── -->
<polygon
  points="0,450 0,368 45,352 90,362 135,342 180,356 225,336 275,348 310,328 355,344 390,322 430,340 468,326 505,342 542,330 582,346 620,334 662,350 700,338 742,354 780,342 800,350 800,450"
  fill="#030A12"/>
<polyline
  points="0,368 45,352 90,362 135,342 180,356 225,336 275,348 310,328 355,344 390,322 430,340 468,326 505,342 542,330 582,346 620,334 662,350 700,338 742,354 780,342 800,350"
  stroke="#0D2035" stroke-width="1" fill="none"/>

<!-- ── MNT EMBARK WORDMARK ── -->
<!-- Aurora halo glow behind text -->
<text x="400" y="303"
  text-anchor="middle"
  font-family="Georgia, 'Times New Roman', serif"
  font-size="58" font-weight="300"
  letter-spacing="20"
  fill="#00FFAA" opacity="0.18"
  filter="url(#aGlow)">MNT EMBARK</text>
<!-- Main wordmark -->
<text x="400" y="303"
  text-anchor="middle"
  font-family="Georgia, 'Times New Roman', serif"
  font-size="58" font-weight="300"
  letter-spacing="20"
  fill="url(#textAurora)"
  filter="url(#tGlow)">MNT EMBARK</text>

<!-- Decorative rule under wordmark -->
<line x1="148" y1="314" x2="652" y2="314" stroke="#44FFAA" stroke-width="0.6" opacity="0.40"/>

<!-- ── TAGLINE ── -->
<text x="400" y="336"
  text-anchor="middle"
  font-family="Arial, Helvetica, sans-serif"
  font-size="9" font-weight="400"
  letter-spacing="6"
  fill="#55BBAA" opacity="0.75">BEYOND THE REACH OF THE ORDINARY</text>

</svg>
