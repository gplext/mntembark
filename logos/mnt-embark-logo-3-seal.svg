<svg width="460" height="320" viewBox="0 0 460 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="460" height="320" fill="#0C0C0C"/>

  <!-- Outer rectangle border -->
  <rect x="28" y="28" width="404" height="264" rx="0"
    stroke="#B89A4A" stroke-width="1.2" fill="none"/>

  <!-- Inner rectangle border (inset 6px) -->
  <rect x="40" y="40" width="380" height="240" rx="0"
    stroke="#B89A4A" stroke-width="0.5" fill="none"/>

  <!-- Corner diamond ornaments (outer corners) -->
  <polygon points="28,28 36,22 44,28 36,34" fill="#B89A4A"/>
  <polygon points="432,28 440,22 448,28 440,34" fill="#B89A4A"/>
  <polygon points="28,292 36,286 44,292 36,298" fill="#B89A4A"/>
  <polygon points="432,292 440,286 448,292 440,298" fill="#B89A4A"/>

  <!-- Brand label top -->
  <text x="230" y="80"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="8.5" font-weight="400"
    letter-spacing="6"
    fill="#7A6532">ESTABLISHED · MMXXI</text>

  <!-- Top rule -->
  <line x1="80" y1="90" x2="380" y2="90" stroke="#B89A4A" stroke-width="0.7"/>

  <!-- Main wordmark: MNT -->
  <text x="230" y="128"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="46" font-weight="300"
    letter-spacing="22"
    fill="#B89A4A">MNT</text>

  <!-- Centre mountain mark (small, elegant) between MNT and EMBARK -->
  <!-- Diamond apex -->
  <polygon points="230,142 232.5,148 230,154 227.5,148" fill="#B89A4A"/>
  <!-- Tiny mountain flanking the diamond -->
  <polyline points="186,170 200,154 210,162 230,142 250,162 260,154 274,170"
    stroke="#B89A4A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Tiny base line -->
  <line x1="186" y1="170" x2="274" y2="170" stroke="#B89A4A" stroke-width="0.9"/>
  <!-- Tiny terminal dots -->
  <circle cx="186" cy="170" r="2" fill="#B89A4A"/>
  <circle cx="274" cy="170" r="2" fill="#B89A4A"/>

  <!-- Flanking rules beside the mountain mark -->
  <line x1="80" y1="156" x2="172" y2="156" stroke="#B89A4A" stroke-width="0.6"/>
  <line x1="288" y1="156" x2="380" y2="156" stroke="#B89A4A" stroke-width="0.6"/>
  <!-- Small end ornaments -->
  <line x1="80" y1="150" x2="80" y2="162" stroke="#B89A4A" stroke-width="0.8"/>
  <line x1="380" y1="150" x2="380" y2="162" stroke="#B89A4A" stroke-width="0.8"/>

  <!-- Bottom rule -->
  <line x1="80" y1="186" x2="380" y2="186" stroke="#B89A4A" stroke-width="0.7"/>

  <!-- EMBARK wordmark -->
  <text x="230" y="224"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="34" font-weight="300"
    letter-spacing="18"
    fill="#B89A4A">EMBARK</text>

  <!-- Tagline -->
  <text x="230" y="254"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="8" font-weight="400"
    letter-spacing="4.5"
    fill="#7A6532">BEYOND THE REACH OF THE ORDINARY</text>
</svg>
