<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="480" height="480" fill="#0C0C0C"/>

  <!-- ── OUTER FRAME (thin rounded rect) ── -->
  <rect x="22" y="22" width="436" height="436" rx="4"
    stroke="#B89A4A" stroke-width="1.2" fill="none"/>
  <!-- Inner frame hairline -->
  <rect x="32" y="32" width="416" height="416" rx="2"
    stroke="#B89A4A" stroke-width="0.4" fill="none"/>

  <!-- Corner diamond ornaments -->
  <polygon points="22,22 30,14 38,22 30,30" fill="#B89A4A"/>
  <polygon points="458,22 466,14 474,22 466,30" fill="#B89A4A"/>
  <polygon points="22,458 30,450 38,458 30,466" fill="#B89A4A"/>
  <polygon points="458,458 466,450 474,458 466,466" fill="#B89A4A"/>

  <!-- ── BRAND LABEL TOP ── -->
  <text x="240" y="68"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="8" font-weight="400"
    letter-spacing="5"
    fill="#7A6532">PRIVATE JOURNEYS · EST. MMXXI</text>

  <!-- Top rule -->
  <line x1="80" y1="78" x2="400" y2="78" stroke="#B89A4A" stroke-width="0.6"/>

  <!-- ── MOUNTAINS (gold) ── -->
  <polygon points="58,240 148,128 238,240"  fill="#B89A4A"/>
  <polygon points="220,240 290,100 360,240" fill="#C4A455"/>
  <polygon points="342,240 422,128 502,240" fill="#B89A4A"/>

  <!-- Clip mountains inside frame -->
  <clipPath id="frameClip">
    <rect x="58" y="100" width="364" height="280"/>
  </clipPath>

  <!-- ── SNOW LINES ── -->
  <!-- Left peak snow line -->
  <line x1="113" y1="164" x2="183" y2="164" stroke="#F2EDE3" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Center peak snow line -->
  <line x1="261" y1="132" x2="319" y2="132" stroke="#F2EDE3" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Right peak snow line -->
  <line x1="376" y1="164" x2="448" y2="164" stroke="#F2EDE3" stroke-width="2.8" stroke-linecap="round"/>

  <!-- ── WATERLINE ── -->
  <line x1="58" y1="240" x2="422" y2="240" stroke="#B89A4A" stroke-width="1"/>

  <!-- ── LAKE REFLECTIONS ── -->
  <polygon points="58,240 148,292 238,240"  fill="white" opacity="0.15"/>
  <polygon points="220,240 290,314 360,240" fill="white" opacity="0.22"/>
  <polygon points="342,240 422,292 502,240" fill="white" opacity="0.15"/>

  <!-- Bottom rule -->
  <line x1="80" y1="330" x2="400" y2="330" stroke="#B89A4A" stroke-width="0.6"/>

  <!-- ── WORDMARK ── -->
  <text x="240" y="370"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28" font-weight="300"
    letter-spacing="16"
    fill="#B89A4A">MNT EMBARK</text>

  <!-- ── TAGLINE ── -->
  <text x="240" y="400"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="8" font-weight="400"
    letter-spacing="5"
    fill="#7A6532">BEYOND THE REACH OF THE ORDINARY</text>
</svg>
