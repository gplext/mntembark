<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#0C0C0C"/>

  <!-- Outer oval -->
  <ellipse cx="200" cy="200" rx="178" ry="178"
    stroke="#B89A4A" stroke-width="1.2" fill="none"/>

  <!-- Inner oval (double-line detail) -->
  <ellipse cx="200" cy="200" rx="168" ry="168"
    stroke="#B89A4A" stroke-width="0.5" fill="none"/>

  <!-- Top section: MNT -->
  <text x="200" y="100"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28" font-weight="300"
    letter-spacing="16"
    fill="#B89A4A">MNT</text>

  <!-- Thin rule below MNT -->
  <line x1="130" y1="112" x2="270" y2="112" stroke="#B89A4A" stroke-width="0.7"/>

  <!-- Small top center diamond ornament -->
  <polygon points="200,118 203,124 200,130 197,124" fill="#B89A4A"/>

  <!-- Mountain peaks -->
  <polyline
    points="90,242 128,190 156,214 200,165 244,214 272,190 310,242"
    stroke="#B89A4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Base line -->
  <line x1="90" y1="242" x2="310" y2="242" stroke="#B89A4A" stroke-width="1.2"/>

  <!-- Terminal dots on base -->
  <circle cx="90"  cy="242" r="3" fill="#B89A4A"/>
  <circle cx="310" cy="242" r="3" fill="#B89A4A"/>

  <!-- Thin rule above EMBARK -->
  <line x1="130" y1="258" x2="270" y2="258" stroke="#B89A4A" stroke-width="0.7"/>

  <!-- Bottom section: EMBARK -->
  <text x="200" y="290"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="22" font-weight="300"
    letter-spacing="14"
    fill="#B89A4A">EMBARK</text>

  <!-- Tagline curved or straight below -->
  <text x="200" y="316"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="8" font-weight="400"
    letter-spacing="4"
    fill="#7A6532">EXCLUSIVE · PRIVATE · EXTRAORDINARY</text>

  <!-- Small ornamental dots at E/W of inner oval -->
  <circle cx="32"  cy="200" r="2.5" fill="#B89A4A"/>
  <circle cx="368" cy="200" r="2.5" fill="#B89A4A"/>
</svg>
