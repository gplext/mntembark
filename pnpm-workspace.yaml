# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), you can add it to the
# `minimumReleaseAgeExclude` allowlist below. Only consider doing this for
# packages released by trusted organizations with an impeccable security
# posture (e.g. Replit packsges, react from Meta, typescript from Microsoft). Even then,
# remove the exclusion once the 1-day window has passed.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  # These are published by Replit and trusted — the supply-chain attack vector
  # this setting guards against does not apply to our own packages.
  - stripe-replit-sync

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

# Packages allowed to run install scripts. pnpm 11 calls this `allowBuilds`;
# `onlyBuiltDependencies` was its pnpm 10 name and is no longer acted on, which
# is how esbuild ended up blocked while apparently being listed.
#
# sharp needs its script to obtain the native libvips binary that does image
# processing. onnxruntime-node needs its to fetch native runtime binaries, and
# only matters when semantic search is enabled.
allowBuilds:
  # Every package in this workspace that has an install script, found by scanning
  # node_modules rather than discovering them one failed install at a time.
  esbuild: true           # fetches its native binary
  sharp: true             # obtains libvips, which does the image processing
  protobufjs: true        # generates its CLI helpers
overrides:
  # Version pins moved here from package.json's `pnpm.overrides`. pnpm 11 no
  # longer reads that field, so from pnpm 11 onward they were silently not
  # applied. This is the only place pnpm 11 looks.
  react: 19.1.0
  react-dom: 19.1.0
  drizzle-orm: 0.45.2

  # SECURITY — do not remove. drizzle-kit bundles an older esbuild with a known
  # vulnerability; these force it up and replace the deprecated loader.
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.27.3"

  # Platform binaries for systems this project is never built on.
  #
  # These do not change what gets INSTALLED — pnpm already filters optional
  # dependencies by os/cpu. What they save is RESOLUTION: without them pnpm
  # requests registry metadata for all 82 of these, which on a slow link cost
  # 30-50s of timeouts per build.
  #
  # Deliberately KEPT, because removing them breaks a real target:
  #   linux-x64 and *-gnu   -> the Docker image
  #   linuxmusl / *-musl    -> Alpine, which the Docker image is based on
  #   win32-x64 and *-msvc  -> local development on Windows
  #
  # An earlier version of this block excluded win32 too, which left esbuild
  # with no binary on Windows. If you add a platform (an arm64 Mac, say),
  # remove its lines here first.
  "@tailwindcss/oxide>@tailwindcss/oxide-android-arm64": "-"
  "@tailwindcss/oxide>@tailwindcss/oxide-darwin-arm64": "-"
  "@tailwindcss/oxide>@tailwindcss/oxide-darwin-x64": "-"
