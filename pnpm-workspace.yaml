# Require npm packages to have been published for at least 1 day before pnpm
# will install them. This is a defence against supply-chain attacks: malicious
# npm releases are usually discovered and pulled within hours.
#
# Do not set this to 0. If you urgently need a just-published version, add the
# package name to a `minimumReleaseAgeExclude:` list and remove it once the
# window has passed.
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # drizzle-kit bundles an older, vulnerable esbuild internally - force it onto tsx
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.27.3"
  react: 19.1.0
  react-dom: 19.1.0
  drizzle-orm: 0.45.2
