# Deploying to Coolify with a Separate PostgreSQL Resource:
#   1. Provision a PostgreSQL Database resource in Coolify.
#   2. In Coolify project settings, set DATABASE_URL to your PostgreSQL connection string.
#   3. Deploy this Compose stack. The 'db' service is under the 'with-db' profile,
#      so Coolify will only start the 'app' container and connect to your standalone DB.
#
# Running locally with embedded PostgreSQL:
#   - Run: docker compose --profile with-db up
#   - Or set COMPOSE_PROFILES=with-db in your local .env file.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${PORT:-8080}:8080'
    expose:
      - '8080'
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://mnt:${POSTGRES_PASSWORD:-changeme}@db:5432/mnt_embark}
      SESSION_SECRET: ${SESSION_SECRET:-secret_key_change_me_in_production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      UPLOAD_DIR: /data/uploads
      # Outgoing email. Compose only passes through what is listed here, so a
      # value present in .env but absent from this block never reaches the
      # container - the app would start with email silently unconfigured.
      # All optional: leave them unset and enquiries still save, with their
      # notifications queued and the reason recorded.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      ADMIN_NOTIFY_EMAILS: ${ADMIN_NOTIFY_EMAILS:-}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      IMAP_SENT_MAILBOX: ${IMAP_SENT_MAILBOX:-Sent}
    volumes:
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - with-db
      - local
    # Exposed so you can push the Drizzle schema from the host:
    #   pnpm --filter @workspace/db run push
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mnt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-mnt_embark}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mnt} -d ${POSTGRES_DB:-mnt_embark}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-data:
  db-data:

