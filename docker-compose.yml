# ==============================================================================
# MNT Embark — Docker Compose Configuration
# ==============================================================================
#
# Production Deployment (Coolify / Standalone PostgreSQL):
#   1. Set DATABASE_URL to your external/managed PostgreSQL connection string.
#   2. Run: docker compose up -d
#      (The 'db' service will be skipped as it is under the 'with-db' profile)
#
# Local Development with Embedded PostgreSQL:
#   - Run: docker compose --profile with-db up -d --build
#   - Or set COMPOSE_PROFILES=with-db in your local .env file.
#
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mnt_embark_app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    expose:
      - "8080"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://mnt:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-mnt_embark}}
      SESSION_SECRET: ${SESSION_SECRET:-secret_key_change_me_in_production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      UPLOAD_DIR: /data/uploads
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}

      # ── Outgoing SMTP & Notifications ──
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-MNT Embark}
      ADMIN_NOTIFY_EMAILS: ${ADMIN_NOTIFY_EMAILS:-}

      # ── IMAP Sent Folder Synchronization ──
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      IMAP_SENT_MAILBOX: ${IMAP_SENT_MAILBOX:-Sent}

      # ── WhatsApp Cloud API (Meta) ──
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_NOTIFY_NUMBERS: ${WHATSAPP_NOTIFY_NUMBERS:-}
      WHATSAPP_CLIENT_TEMPLATE: ${WHATSAPP_CLIENT_TEMPLATE:-enquiry_confirmation}
      WHATSAPP_ADMIN_TEMPLATE: ${WHATSAPP_ADMIN_TEMPLATE:-enquiry_alert}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
      DEFAULT_PHONE_COUNTRY_CODE: ${DEFAULT_PHONE_COUNTRY_CODE:-}
    volumes:
      - app-data:/data
    networks:
      - mnt-network
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/destinations || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: mnt_embark_db
    restart: unless-stopped
    profiles:
      - with-db
      - local
      - dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mnt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-mnt_embark}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - mnt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mnt} -d ${POSTGRES_DB:-mnt_embark}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  mnt-network:
    name: mnt_embark_network
    driver: bridge

volumes:
  app-data:
    name: mnt_embark_app_data
  db-data:
    name: mnt_embark_db_data
